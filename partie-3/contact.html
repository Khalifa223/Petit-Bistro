<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact – Le Petit Bistro</title>
</head>
<body>

    <header>
        <img src="images/logo.png" alt="Logo du Petit Bistro">
        <h1>Le Petit Bistro</h1>

        <nav>
            <ul>
                <li><a href="index.html#presentation">Présentation</a></li>
                <li><a href="index.html#carte">La carte</a></li>
                <li><a href="index.html#horaires">Horaires</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Demande de réservation</h2>

            <form>
                <fieldset>
                    <legend>Vos coordonnées</legend>

                    <p>
                        <label for="nom">Nom complet</label>
                        <input type="text" id="nom" name="nom" required>
                    </p>
                    <p>
                        <label for="email">Adresse e-mail</label>
                        <input type="email" id="email" name="email" required>
                    </p>
                    <p>
                        <label for="telephone">Numéro de téléphone</label>
                        <input type="tel" id="telephone" name="telephone">
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Votre réservation</legend>

                    <p>
                        <label for="date">Date souhaitée</label>
                        <input type="date" id="date" name="date">
                    </p>
                    <p>
                        <label for="heure">Heure souhaitée</label>
                        <input type="time" id="heure" name="heure">
                    </p>
                    <p>
                        <label for="personnes">Nombre de personnes</label>
                        <input type="number" id="personnes" name="personnes" min="1" max="12">
                    </p>
                    <p>
                        <label for="motif">Motif de la demande</label>
                        <select id="motif" name="motif">
                            <option value="reservation">Réservation</option>
                            <option value="question">Question</option>
                            <option value="evenement">Événement privé</option>
                        </select>
                    </p>
                    <p>
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5"></textarea>
                    </p>
                </fieldset>

                <p>
                    <input type="checkbox" id="recontact" name="recontact">
                    <label for="recontact">J'accepte d'être recontacté</label>
                </p>

                <p>
                    <button type="submit">Envoyer la demande</button>
                </p>
            </form>
        </section>

    </main>

    <footer>
        <address>
            Le Petit Bistro<br>
            Rue 310, Porte 45, ACI 2000<br>
            Bamako, Mali<br>
            Téléphone : <a href="tel:+22320223344">+223 20 22 33 44</a><br>
            E-mail : <a href="mailto:contact@lepetitbistro.ml">contact@lepetitbistro.ml</a>
        </address>
        <p>
            <a href="https://www.google.com/maps/search/?api=1&amp;query=ACI+2000+Bamako+Mali" target="_blank">Voir le plan d'accès</a>
        </p>
    </footer>

</body>
</html>
